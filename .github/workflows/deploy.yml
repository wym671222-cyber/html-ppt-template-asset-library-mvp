name: Deployment guard

# P11 intentionally contains no remote deployment path. Production release is
# separately approval-gated and will be introduced only by the approved P16/P17 work.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployment-disabled:
    name: Confirm automated deployment is disabled
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Explain the approval boundary
        run: echo "Automated deployment is disabled; follow the approved P16/P17 release process."
